name: FinanceTrackeriOS
options:
  bundleIdPrefix: com.dakota
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 4.2.0
    DEVELOPMENT_TEAM: R79MH5A2VX
    ENABLE_TESTABILITY: YES
configs:
  Debug: debug
  Staging: release
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
targets:
  FinanceTrackerAI:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/xcconfigs/Debug.xcconfig
      Staging: Config/xcconfigs/Staging.xcconfig
      Release: Config/xcconfigs/Release.xcconfig
    sources:
      - path: App Template
        excludes:
          - "**/INSTRUCTIONS.md"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakota.financetracker2025
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinanceTrackerAI.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics
      # FirebaseFirestoreSwift was merged into FirebaseFirestore in SDK 11+
  FinanceTrackerAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App TemplateTests
    dependencies:
      - target: FinanceTrackerAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakota.financetracker2025.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FinanceTrackerAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FinanceTrackerAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FinanceTrackerAI:
    build:
      targets:
        FinanceTrackerAI: all
        FinanceTrackerAITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinanceTrackerAITests
    archive:
      config: Release
